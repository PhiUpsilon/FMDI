[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmdi"
version = "1.0.0"
description = "Official implementation of FMDI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.22",
  "pandas>=1.4",
  "PyYAML>=6.0",
  "torch>=1.12",
  "tqdm>=4.64",
  "linear-attention-transformer>=0.19.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
fmdi = "fmdi.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.setuptools.packages.find]
where = ["src"]
